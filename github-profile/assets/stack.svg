<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="900" height="68" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="8%" stop-color="#fff"/>
      <stop offset="92%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="edges"><rect width="900" height="68" fill="url(#fade)"/></mask>

    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="run" font-size="18">
      <text x="0"    y="40" fill="#f0abfc">C++</text>
      <text x="58"   y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="90"   y="40" fill="#9aa5ce">x86 Assembly</text>
      <text x="238"  y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="270"  y="40" fill="#7dd3fc">Java</text>
      <text x="330"  y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="362"  y="40" fill="#9aa5ce">Python</text>
      <text x="446"  y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="478"  y="40" fill="#f0abfc">React</text>
      <text x="546"  y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="578"  y="40" fill="#9aa5ce">PyTorch</text>
      <text x="674"  y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="706"  y="40" fill="#7dd3fc">Android</text>
      <text x="802"  y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="834"  y="40" fill="#9aa5ce">JavaFX</text>
      <text x="918"  y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="950"  y="40" fill="#f0abfc">SFML</text>
      <text x="1012" y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="1044" y="40" fill="#9aa5ce">SQL</text>
      <text x="1094" y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="1126" y="40" fill="#7dd3fc">Figma</text>
      <text x="1196" y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
      <text x="1228" y="40" fill="#9aa5ce">Git</text>
      <text x="1270" y="40" fill="#8b5cf6" filter="url(#g2)">◆</text>
    </g>
  </defs>

  <g mask="url(#edges)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-1310 0" dur="24s" repeatCount="indefinite"/>
      <use href="#run" x="0"/>
      <use href="#run" x="1310"/>
      <use href="#run" x="2620"/>
    </g>
  </g>

  <line x1="0" y1="62" x2="900" y2="62" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
  <rect y="61" width="160" height="2" rx="1" fill="#c084fc" filter="url(#g2)">
    <animate attributeName="x" values="-160;900;-160" dur="24s" repeatCount="indefinite"/>
  </rect>
</svg>
