<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15141f"/>
      <stop offset="100%" stop-color="#191527"/>
    </linearGradient>

    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="win"><rect x="20" y="20" width="860" height="290" rx="14"/></clipPath>

    <clipPath id="c1"><rect x="46" y="76" height="26" width="0">
      <animate attributeName="width" values="0;0;85;85;0;0" keyTimes="0;0.03;0.08;0.92;0.95;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="46" y="110" height="26" width="0">
      <animate attributeName="width" values="0;0;390;390;0;0" keyTimes="0;0.09;0.16;0.92;0.95;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="46" y="144" height="26" width="0">
      <animate attributeName="width" values="0;0;155;155;0;0" keyTimes="0;0.17;0.22;0.92;0.95;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="46" y="178" height="26" width="0">
      <animate attributeName="width" values="0;0;550;550;0;0" keyTimes="0;0.23;0.31;0.92;0.95;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="46" y="212" height="26" width="0">
      <animate attributeName="width" values="0;0;85;85;0;0" keyTimes="0;0.32;0.375;0.92;0.95;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c6"><rect x="46" y="246" height="26" width="0">
      <animate attributeName="width" values="0;0;620;620;0;0" keyTimes="0;0.39;0.47;0.92;0.95;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect x="20" y="20" width="860" height="290" fill="url(#shell)"/>

    <g opacity="0.12" stroke="#8b5cf6" stroke-width="1">
      <path d="M20 70H880M20 120H880M20 170H880M20 220H880M20 270H880"/>
      <path d="M120 20V310M240 20V310M360 20V310M480 20V310M600 20V310M720 20V310"/>
    </g>

    <rect x="20" y="0" width="860" height="70" fill="url(#scan)">
      <animate attributeName="y" values="-70;310;-70" dur="11s" repeatCount="indefinite"/>
    </rect>

    <rect x="20" y="20" width="860" height="36" fill="#0f0e18" fill-opacity="0.7"/>
    <circle cx="46" cy="38" r="5.5" fill="#ff5f57"/>
    <circle cx="66" cy="38" r="5.5" fill="#febc2e"/>
    <circle cx="86" cy="38" r="5.5" fill="#28c840"/>
    <text x="450" y="43" font-size="13" fill="#5f6687" text-anchor="middle">mehrmah@lahore: ~/dev</text>

    <rect x="20" y="20" width="860" height="2" fill="url(#topline)"/>

    <g font-size="17">
      <g clip-path="url(#c1)">
        <text x="46" y="96" fill="#a855f7">$ <tspan fill="#d6d9ea">whoami</tspan></text>
      </g>
      <g clip-path="url(#c2)">
        <text x="46" y="130" fill="#7dd3fc">Mehrmah Khan <tspan fill="#5f6687">//</tspan> <tspan fill="#9aa5ce">CS @ FAST-NUCES Lahore</tspan></text>
      </g>
      <g clip-path="url(#c3)">
        <text x="46" y="164" fill="#a855f7">$ <tspan fill="#d6d9ea">cat stack.txt</tspan></text>
      </g>
      <g clip-path="url(#c4)">
        <text x="46" y="198" fill="#9aa5ce">C++ <tspan fill="#a855f7">·</tspan> x86 Assembly <tspan fill="#a855f7">·</tspan> Java <tspan fill="#a855f7">·</tspan> Android <tspan fill="#a855f7">·</tspan> React <tspan fill="#a855f7">·</tspan> PyTorch</text>
      </g>
      <g clip-path="url(#c5)">
        <text x="46" y="232" fill="#a855f7">$ <tspan fill="#d6d9ea">status</tspan></text>
      </g>
      <g clip-path="url(#c6)">
        <text x="46" y="266" fill="#f0abfc">building SafeCity, MindBloom, SkyRead <tspan fill="#5f6687">//</tspan> <tspan fill="#9aa5ce">always something on the side</tspan></text>
      </g>
    </g>

    <rect width="10" height="20" fill="#c084fc" filter="url(#softglow)">
      <animate attributeName="x" calcMode="discrete"
        values="131;436;201;596;131;666;666"
        keyTimes="0;0.09;0.17;0.23;0.32;0.39;0.95" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="y" calcMode="discrete"
        values="80;114;148;182;216;250;250"
        keyTimes="0;0.09;0.17;0.23;0.32;0.39;0.95" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="20" y="20" width="860" height="290" rx="14" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
