<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13131f"/>
      <stop offset="50%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#191324"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e2de2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4a00e0" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#60a5fa;#f472b6;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#f472b6;#c084fc;#60a5fa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="orb" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="280" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <g opacity="0.16" stroke="#8b5cf6" stroke-width="1">
      <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000"/>
      <path d="M40 0V280M120 0V280M200 0V280M280 0V280M360 0V280M440 0V280M520 0V280M600 0V280M680 0V280M760 0V280M840 0V280M920 0V280"/>
    </g>

    <rect width="1000" height="280" fill="url(#sweep)"/>

    <circle cx="820" cy="140" r="150" fill="url(#orb)">
      <animate attributeName="r" values="140;165;140" dur="7s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle cx="60" cy="60" r="2" fill="#a855f7">
        <animate attributeName="cy" values="60;30;60" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="220" r="1.8" fill="#60a5fa">
        <animate attributeName="cy" values="220;190;220" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="50" r="1.5" fill="#f472b6">
        <animate attributeName="cy" values="50;80;50" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="245" r="2.2" fill="#a855f7">
        <animate attributeName="cy" values="245;215;245" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="230" r="1.6" fill="#60a5fa">
        <animate attributeName="cy" values="230;200;230" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="660" cy="40" r="1.7" fill="#c084fc">
        <animate attributeName="cy" values="40;68;40" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="7.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(820 140)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
        <ellipse rx="112" ry="112" fill="none" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="5 9"/>
        <circle cx="112" cy="0" r="4.5" fill="#c084fc" filter="url(#glow)"/>
        <circle cx="-112" cy="0" r="3" fill="#60a5fa" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
        <ellipse rx="78" ry="78" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 7"/>
        <circle cx="0" cy="78" r="3.5" fill="#f472b6" filter="url(#glow)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <ellipse rx="46" ry="46" fill="none" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="46" cy="0" r="3" fill="#a855f7" filter="url(#glow)"/>
      </g>
      <circle r="17" fill="#a855f7" opacity="0.25" filter="url(#softGlow)">
        <animate attributeName="r" values="15;23;15" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="#e9d5ff"/>
    </g>

    <g transform="translate(70 86)">
      <text font-size="15" fill="#6b7a99">&lt;dev&gt;</text>

      <text y="54" font-size="46" font-weight="700" fill="url(#nameGrad)" filter="url(#glow)">Mehrmah Khan</text>

      <g transform="translate(0 88)">
        <text font-size="16" fill="#9aa5ce">CS @ FAST-NUCES Lahore</text>
        <text x="215" font-size="16" fill="#8b5cf6">//</text>
        <text x="240" font-size="16" fill="#9aa5ce">builds across the stack</text>
      </g>

      <g transform="translate(0 118)">
        <text font-size="15" fill="#565f89">x86 Assembly</text>
        <text x="110" font-size="15" fill="#a855f7">→</text>
        <text x="132" font-size="15" fill="#565f89">C++</text>
        <text x="168" font-size="15" fill="#a855f7">→</text>
        <text x="190" font-size="15" fill="#565f89">Android</text>
        <text x="258" font-size="15" fill="#a855f7">→</text>
        <text x="280" font-size="15" fill="#565f89">React</text>
        <text x="332" font-size="15" fill="#a855f7">→</text>
        <text x="354" font-size="15" fill="#565f89">PyTorch</text>
      </g>

      <rect y="136" width="0" height="2" rx="1" fill="url(#nameGrad)">
        <animate attributeName="width" values="0;430;430;0" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>

      <text y="166" font-size="15" fill="#6b7a99">&lt;/dev&gt;</text>
    </g>

    <rect x="0" y="0" width="1000" height="280" rx="20" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
</svg>
